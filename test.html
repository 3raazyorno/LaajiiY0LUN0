body
{
    background : #000000;
    text-align : center;
}

#n_noise
{
    position : fixed;
    top : 0;
    left : 0;
    width : 100%;
    height : 100%;
    z-index : -2;
}

</style>

<canvas id = "n_noise"> </canvas>

<script>

const canvas = document.getElementById ("n_noise");
const ctx = canvas.getContext ("2d");

function n_generate ()
{
    const w = 256;
    const h = 256;

    canvas.width = w;
    canvas.height = h;

    const img = ctx.createImageData (w, h);

    const n_seed = Math.random () * 512;

    for (let y = 0; y < h; y++)
    {
        for (let x = 0; x < w; x++)
        {
            const i = (y * w + x) * 4;

            const n_wave =
                Math.sin (x * 0.125 + n_seed) *
                Math.cos (y * 0.125 + n_seed);

            const n_noise = Math.random () * 128;

            const n_value =
                256 + n_wave * 64 + n_noise - 64;

            img.data [i] = n_value * 2;
            img.data [i + 1] = n_value * 0.5;
            img.data [i + 2] = n_value * 2;
            img.data [i + 3] = 128;
        }
    }

    ctx.putImageData (img, 0, 0);
}

n_generate ();

</script>
